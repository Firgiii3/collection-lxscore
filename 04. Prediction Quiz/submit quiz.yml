info:
  name: submit quiz
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/public/match_order/quiz"
  body:
    type: json
    data: |-
      [
      {
          "match_order_id":"0119427f-5a0b-4897-b728-f91bc88b29b6",
          "home_team_prediction_score": 1,
          "away_team_prediction_score": 2
      }
      ]
  auth:
    type: bearer
    token: "{{user_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
