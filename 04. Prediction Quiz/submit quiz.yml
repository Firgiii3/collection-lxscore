  url: "{{base_url}}/v1/public/match_order/quiz"
  body:
    type: json
    data: "[\r

      {\r

      \    \"match_order_id\":\"\",\r

      \    \"home_team_prediction_score\":\"\",\r

      \    \"away_team_prediction_score\":\"\"\r

      }\r

      ]"
