info:
  name: Create Feed
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/internal/feed"
  body:
    type: json
    data: |-
      {
        "organization_id": "string",
        "status": "publish" ,
        "category_id": "string",
        "published_at": "string",
        "contents": {
          "title": "string",
          "content": "string",
          "thumbnail": "string",
          "video": "string"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
