info:
  name: Storage Feed Category
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/internal/feed/category"
  body:
    type: json
    data: |-
      {
        "names" : "string"
      }
  auth:
    type: bearer
    token: "{{internal_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
