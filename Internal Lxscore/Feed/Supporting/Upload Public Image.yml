info:
  name: Upload Public Image
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/storage/public/image"
  body:
    type: json
    data: |-
      {
        "file": "image.jpg"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
