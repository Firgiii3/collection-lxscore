info:
  name: Delete Internal Layout
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{base_url}}/v1/internal/layout/{id}?organization_id={{organization_id}}"
  params:
    - name: organization_id
      value: "{{organization_id}}"
      type: query
  auth:
    type: bearer
    token: "{{internal_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
