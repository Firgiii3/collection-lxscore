info:
  name: Internal Layout By OrganizationId
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/internal/layout?organization_id={{organization_id}}"
  params:
    - name: organization_id
      value: "{{organization_id}}"
      type: query
  auth:
    type: bearer
    token: "{{internal_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
