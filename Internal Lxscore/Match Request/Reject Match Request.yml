  url: "{{base_url}}/v1/internal/match-request/{id}/reject"
  body:
    type: json
    data: |-
      {
        "note" :match kelewat
      }
  auth:
    type: bearer
    token: "{{internal_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
