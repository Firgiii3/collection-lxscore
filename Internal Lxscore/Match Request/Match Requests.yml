info:
  name: Match Requests
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/internal/match-request?status=&next=&limit="
  params:
    - name: status
      value: ""
      type: query
    - name: next
      value: ""
      type: query
    - name: limit
      value: ""
      type: query
  auth:
    type: bearer
    token: "{{internal_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
