info:
  name: Get Live Match
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/client/live-match?next=1&limit=1&status=all"
  params:
    - name: next
      value: "1"
      type: query
    - name: limit
      value: "1"
      type: query
    - name: status
      value: all
      type: query
  auth:
    type: bearer
    token: "{{client_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
