info:
  name: login internal
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/internal/auth/login"
  headers:
    - name: X-Organization
      value: "{{organization_id}}"
  body:
    type: json
    data: "{\r

      \    \"email\": \"manager@livesport.com\",\r

      \    \"password\": \"test\"\r

      }"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test(\"Login Internal success\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });\r

        \r

        const jsonData = res.getBody();\r

        \r

        const internalToken =\r

        \    jsonData.data?.access_token ||\r

        \    jsonData.data?.token ||\r

        \    jsonData.token;\r

        \r

        expect(internalToken, \"Internal token tidak ditemukan\").to.exist;\r

        \r

        bru.setEnvVar(\"internal_token\", internalToken);"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
