info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/public/auth/login"
  headers:
    - name: X-Organization
      value: "{{organization_id}}"
  body:
    type: json
    data: "{\r

      \    \"email\": \"testingsanity1@gmail.com\",\r

      \    \"password\": \"testing123\"\r

      }"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Bruno Post-Response Script - Auto capture access_token & refresh_token

        test("Login successful - status code 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        let jsonData;
        try {
          jsonData = res.getBody();
        } catch (e) {
          console.error("Response bukan JSON valid:", e);
        }

        if (jsonData && jsonData.success === true && jsonData.data) {
          // Simpan access_token ke variable "user_token"
          if (jsonData.data.access_token) {
            bru.setVar("user_token", jsonData.data.access_token);
            console.log("user_token berhasil disimpan:", jsonData.data.access_token);
          } else {
            console.warn("access_token tidak ditemukan di response");
          }

          // Simpan refresh_token juga (opsional, buat refresh nanti)
          if (jsonData.data.refresh_token) {
            bru.setVar("user_refresh_token", jsonData.data.refresh_token);
            console.log("user_refresh_token berhasil disimpan");
          }

          test("access_token tersimpan di variable", function () {
            expect(bru.getVar("user_token")).to.be.a("string").and.not.empty;
          });
        } else {
          console.error("Login gagal atau response tidak sesuai format:", jsonData);
          test("Login response format valid", function () {
            expect.fail("Response tidak mengandung data.access_token");
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
