info:
  name: create support ticket
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/public/support-tickets"
  body:
    type: json
    data: |-
      {

      "topic": "claim",
      "title": "Point belum masuk",
        "description": "Saya sudah menonton match Portugal vs Uzbekistan, tapi point belum bertambah.",
        "attachment": [
          "support-ticket/2026/06/25/point-error-1.png",
          "support-ticket/2026/06/25/point-error-2.png"
        ],
        "reference_ticket_id": "9a72c5f5-6e3a-43a3-8e96-40a8c35c4e91"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
